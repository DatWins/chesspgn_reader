<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGN Reader</title>
<style>
:root{
  --fs:21px;
  --paper:#fbfaf7; --ink:#1d1f22; --muted:#5d6670; --line:#e2e0da; --side:#f2f0eb;
  --main:#1f4fa3; --var:#2b2f36; --hl:#ffe08a; --hlink:#e8eefb;
  --light:#dee3e6; --dark:#8ca2ad; --lm:rgba(155,199,0,.45); --sel:rgba(20,85,30,.5);
  --btn:#ffffff; --btnb:#cfd5db;
}
:root[data-theme="dark"]{
  --paper:#16191d; --ink:#e4e6e9; --muted:#9aa3ad; --line:#2c3238; --side:#1d2126;
  --main:#86b4ff; --var:#d5d9de; --hl:#6b5a1e; --hlink:#25324a;
  --btn:#232930; --btnb:#3a434c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:var(--fs);line-height:1.6}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--side);border-bottom:1px solid var(--line);font-family:system-ui,"Segoe UI",sans-serif;font-size:15px}
.top .t{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;font-family:system-ui,"Segoe UI",sans-serif;background:var(--btn);color:var(--ink);border:1px solid var(--btnb);border-radius:7px;padding:6px 12px;cursor:pointer;min-width:40px}
button:hover{border-color:var(--main)}
button:disabled{opacity:.35;cursor:default}

/* 3-column layout: toc | content | board */
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr) auto;align-items:start}
:root{--bw:min(44vw, calc(100vh - 290px), 680px)}

/* left sidebar – game list */
nav.toc{position:sticky;top:49px;height:calc(100vh - 49px);overflow:auto;padding:18px 14px;border-right:1px solid var(--line);background:var(--side);font-family:system-ui,"Segoe UI",sans-serif;font-size:15px}
nav.toc .h{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.06em;margin-bottom:8px}
nav.toc a{display:block;padding:8px 10px 8px 12px;margin:2px 0;border-radius:6px;border-left:4px solid transparent;color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer;line-height:1.35}
nav.toc a:hover{background:var(--hlink);color:var(--main)}
nav.toc a.on{background:var(--main);color:#fff;font-weight:700;border-left-color:#f2b500}
:root[data-theme="dark"] nav.toc a.on{color:#111}

/* center content */
main{padding:28px 40px 120px;max-width:44em;margin:0 auto;width:100%}
.kicker{font-family:system-ui,"Segoe UI",sans-serif;font-size:.7em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
h1{font-family:system-ui,"Segoe UI",sans-serif;font-size:2.3em;line-height:1.1;margin:.2em 0 .15em}
.gamehead{font-size:.9em;line-height:1.5;margin:.4em 0 .8em;color:var(--muted)}
.gamehead b{color:var(--ink)}
h2{font-family:system-ui,"Segoe UI",sans-serif;font-size:1.25em;margin:1.8em 0 .5em;padding-top:.4em;border-top:2px solid var(--line)}
p{margin:.65em 0}

/* moves */
a.mv{cursor:pointer;border-radius:4px;padding:0 2px;color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted);font-weight:700}
a.mv:hover{background:var(--hlink)}
a.mv.cur{background:var(--hl);border-bottom-color:transparent}
.ml{font-weight:700;font-size:1.05em;margin:1em 0 .4em;line-height:1.8}
.ml a.mv{color:var(--main);border-bottom:none}

/* comments */
.comment{display:inline;font-style:italic;color:var(--muted);font-size:.88em;font-weight:400;margin:0 4px}
.comment-block{display:block;background:var(--side);border-left:3px solid var(--main);padding:12px 16px;margin:12px 0;border-radius:0 6px 6px 0;font-style:normal;color:var(--ink);font-size:.9em;line-height:1.6;font-weight:400}
.comment-block .clabel{display:inline-block;font-weight:700;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:3px;margin-right:6px;vertical-align:middle}
.clabel.cl-green{background:#2a7e19;color:#fff}
.clabel.cl-red{background:#c0392b;color:#fff}
.clabel.cl-blue{background:var(--main);color:#fff}
.clabel.cl-purple{background:#7b2d8e;color:#fff}
.clabel.cl-orange{background:#d4740a;color:#fff}
.clabel.cl-teal{background:#0e8a7e;color:#fff}
.clabel.cl-default{background:#555;color:#fff}
.comment-block .csrc{display:block;margin-top:6px;font-size:.82em;color:var(--muted);font-style:italic}
.variation{display:inline;font-style:italic;color:var(--muted);font-size:.85em;margin:0 2px;opacity:.85}

/* right board panel */
aside.bp{position:sticky;top:49px;padding:16px 20px;border-left:1px solid var(--line);height:calc(100vh - 49px);overflow:auto;width:calc(var(--bw) + 70px)}
.bhead{font-family:system-ui,"Segoe UI",sans-serif;font-size:15px;color:var(--muted);margin-bottom:8px;min-height:1.4em;display:flex;justify-content:space-between;gap:10px}
.bhead b{color:var(--ink);font-size:17px}
.ctrls{display:flex;gap:6px;margin:12px 0 0 22px;flex-wrap:wrap}
.ctrls button{font-size:18px;padding:5px 12px}
.msg{margin:8px 0 0 22px;font-family:system-ui,"Segoe UI",sans-serif;font-size:14px;color:var(--muted)}

/* board comment display below controls */
.board-comment{margin:10px 0 0 22px;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-style:normal;font-size:.88em;color:var(--ink);font-weight:400;line-height:1.55;max-height:180px;overflow-y:auto}

/* boards */
.bwrap{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;width:max-content}
.bd-container{position:relative;aspect-ratio:1}
.bd{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%;border:2px solid #5b6f79;user-select:none}
.sq{position:relative}
.sq.l{background:var(--light)} .sq.d{background:var(--dark)}
.sq.lm::after{content:"";position:absolute;inset:0;background:var(--lm)}
.circ{position:absolute;border-radius:50%;border:3px solid rgba(20,85,30,.8);z-index:3;pointer-events:none}
.sq.lm-from .circ{inset:15%}
.sq.lm-to .circ{inset:8%;border-width:4px;border-color:rgba(20,85,30,.9)}
.pc{position:absolute;inset:0;background-size:100% 100%;z-index:1}
.rk{display:grid;grid-template-rows:repeat(8,minmax(0,1fr));line-height:1;font-family:system-ui,sans-serif;color:var(--muted);text-align:center;padding-right:5px}
.fl{grid-column:2;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));line-height:1.4;font-family:system-ui,sans-serif;color:var(--muted);text-align:center}
.rk span{display:flex;align-items:center}
#live .bd-container{width:var(--bw)} #live .rk,#live .fl{font-size:14px}

/* SVG overlay for arrows and circles */
.svg-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:4}

/* responsive */
.tog{display:none}
@media (max-width:1100px){
  .top{height:49px;padding:0 10px;gap:6px}
  .top button{padding:5px 9px;min-width:0}
  .tog{display:inline-block}
  .wrap{grid-template-columns:1fr}
  nav.toc{display:none}
  aside.bp{order:-1;position:sticky;top:49px;z-index:10;height:auto;width:auto;border-left:0;border-bottom:1px solid var(--line);background:var(--paper);padding:8px 12px 10px}
  :root{--bw:min(calc(100vw - 96px), 30vh, 520px);--bw:min(calc(100vw - 96px), 30svh, 520px)}
  .bhead{font-size:13px;margin-bottom:4px;align-items:baseline}
  .bhead #who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .bhead b{font-size:15px;white-space:nowrap}
  #live{display:flex;justify-content:center}
  #live .rk,#live .fl{font-size:11px}
  .ctrls,.msg,.board-comment{margin-left:0;justify-content:center;text-align:center}
  .ctrls{margin-top:8px;gap:6px}
  .ctrls button{font-size:17px;padding:4px 0;flex:1;max-width:64px}
  .msg{margin-top:4px;font-size:12px}
  .board-comment{margin-top:6px;max-height:80px}
  main{padding:16px 16px 80px}
  body.hideb #live,body.hideb .bhead{display:none}
}
@media (max-width:480px){
  .top .t{display:none}
}
/* phone landscape */
@media (max-width:1100px) and (orientation:landscape) and (max-height:600px){
  .wrap{grid-template-columns:minmax(0,1fr) auto}
  aside.bp{order:0;top:49px;height:calc(100vh - 49px);height:calc(100svh - 49px);overflow:auto;border-bottom:0;border-left:1px solid var(--line);
    display:grid;grid-template-columns:auto 120px;column-gap:10px;align-content:start;padding:6px 10px}
  :root{--bw:calc(100vh - 49px - 46px);--bw:calc(100svh - 49px - 46px)}
  .bhead{grid-column:1/-1}
  #live{grid-column:1;grid-row:2/span 3}
  .ctrls{grid-column:2;justify-content:flex-start;text-align:left}
  .ctrls{display:grid;grid-template-columns:1fr 1fr;margin-top:0}
  .ctrls button{max-width:none}
  main{padding:14px 16px 60px}
}
main p b a.mv,main p b{color:var(--main);font-weight:700}

/* print styles */
@media print{
  .top,nav.toc,aside.bp,.ctrls,.tog{display:none!important}
  .wrap{display:block!important}
  main{padding:0!important;max-width:none!important}
  h1{color:#000!important}
  .kicker{color:#333!important}
  .gamehead,.gamehead b{color:#333!important}
  a.mv{color:#000!important;border:none!important;font-weight:700!important}
  .comment{color:#555!important;font-style:italic!important;font-weight:400!important}
  .comment-block{background:#f5f5f5!important;border-left-color:#1a4a8a!important;color:#222!important}
  .comment-block .clabel{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .variation{color:#666!important;font-style:italic!important}
  .ml b{color:#000!important}
}
</style>

{ [Vol I p.05 | [FORCED WIN BY TEMPO TRANSFER] | Stage 1: Start the 3-Square Triangle | Kd5 wants this position with Black to move: 1.Kd4! Kd8 2.Kc4!] BEACON: Triangulation walks your King around a 3-square triangle (d5→d4→c4→d5) while the defender has only 2 alternating squares (c8↔d8), forcing Zugzwang. PITFALL: Triangulating without verifying your opponent lacks an equivalent 3-square triangle on their own side. (Source: Fahrni–Alapin 1912 • Dvoretsky DEM #1-27 • De la Villa Ending 12.24.) || BOOK NOTE: If White has already moved his rook's pawn, the ending is still won if Black has also moved his. Positions where the stronger side has moved his pawn, but the defending side has not, require a detailed analysis. We will not deal with those endings in this book. This position illustrates the winning procedure when the defending side has moved his pawn, but it also introduces a very important motif in pawn endings. Therefore, it deserves special attention. I am referring to corresponding squares. Although conceptually clear, this motif can require a very complex analysis. Since I consider that corresponding squares are hardly interesting from a practical point of view, we will not go deeply into them. I recommend the following books for those readers interested in this topic: Pawn Endings, by I. Maizelis (available only on CD-ROM), Secrets of Pawns Endings, by Müller & Lamprecht (Everyman) and The Final Countdown, by Hajenius & Van Riemsdijk (Cadogan). This, however, is the simplest and most frequent case of corresponding squares: triangulation. As it occurs quite frequently in actual games, it is necessary to know this technique. Therefore, we are going to see the correct procedure in detail. The first obvious feature of this position is that the c6 pawn cannot promote, so White will need to capture the black pawn. For that, the white king needs to occupy the b6-square. That is the core of the problem. If White plays Kc5 Black must answer Kc7 to prevent the white king from reaching b6. On the other hand, if White plays Kd6 to promote his pawn, Black must answer Kd8 . these are the two key positions for the defence. Although apparently Black has resources against all White threats, the fact that the black king has to answer accurately any movement by the white king should look suspicious. For instance: what if the white king occupies a square where he threatens to occupy both key squares c5 and d6? Here that square is d5, where he is now. It is obvious that, in that case, Black must move to a spot where he can answer both threats, that is, where he can keep an eye on d8 and c7, and the only valid square for that is c8. Again, Black has found a way to answer Kd5, but again he has just one possibility, and that should arouse our suspicions. Moreover, that third square has become a third critical defensive position. We just have to look for squares where the white king can threaten two (or 3, if possible) key squares, and then check whether Black has an appropriate answer in each case. There is no need to go deeply into theory to find a triangulation through d4 and c4. The king attacks c5 and d5 from those squares. Black lacks a manoeuvre to answer this, so he loses the correspondence and thus the game. If we put a number for each attacking square for the white king, and the same number for the square the black king has to occupy in each case, it is easier to follow the analysis and reasoning. Thus, we say that pairs of corresponding squares are established here. If we look carefully at those corresponding squares, we may see whether the defensive set-up can be broken or not. Corresponding squares are a step beyond opposition. The idea is the same, but opposition is easier to understand, as it is very visual, whereas the pairs of corresponding squares are not so evident, which complicates the analysis. Nevertheless, triangulation, which is the case we have in this position, is not only the most frequent procedure, but also the easiest to handle. Once the goal has been established, it is easy to play the position accurately. } 1. Kd4! { The king goes for triangulation. Of course, any move could eventually win if White later turns to the right path. The white king attacks c5 and d5. } (1. Kc4 { 1.Kd4! Kd8 2.Kc4! works equally well. } 1... Kd8 2. Kd4 Kc8 3. Kd5 Kd8 { 3...Kc7 4.Kc5 ⨀ and 5.Kb6. } (3... Kc7 4. Kc5) 4. Kd6 Kc8 5. c7 { White wins. }) 1... Kd8 { Therefore, Black keeps an eye on the corresponding squares c8 and c7. } { [%cal Gd8c8,Gd8c7] } 2. Kc4 { Zugzwang. Again, the white king attacks c5 and d5. Black cannot simultaneously defend c8 and c7 anymore. } { [%cal Gc4c5,Gc4d5] } 2... Kc8 { Once our opponent has fallen into zugzwang, we occupy the corresponding square. The idea is quite similar to opposition. The black king occupies c8 and the corresponding square is d5 ; therefore: } 3. Kd5 Kc7 { Now the corresponding square is c5, so: } (3... Kd8 4. Kd6 Kc8 5. c7 Kb7 6. Kd7 Ka7) 4. Kc5 { and the white king will occupy b6 and capture the pawn. This manoeuvre can be applied to many other positions with more pawns on the board. In this ending, if the black pawn were more advanced, White would not need to be so subtle. Just pushing the c-pawn and invading the square adjacent to the black pawn would be enough to capture it. On the other hand, we can draw a conclusion from this ending, regarding this kind of position. I will state it immediately, but remember that here the idea of triangulation is more important than the final result of the ending. “Conclusion: The ending with two blocked rook's pawns and an extra bishop's pawn on the same wing, is always won if (given a normal position of the kings) the defending pawn has moved.” } { [%csl Gc5,Rc7][%cal Bc5b6,Bb6a6] } *

e correct route. } { [%csl Bg7,Bf6,Ye5][%cal Bh8g7,Yg7f6] } 1. Kg7! h4 2. Kf6 Kb6 { Black has to spend the first tempo on defence. } { [%csl Rc6] } (2... h3 3. Ke7 h2 4. c7 $10 { and both pawns promote. }) 3. Ke5! { [%cal Ge5f4,Ge5d6] } 3... Kxc6 { And now Black has to spend another tempo on defence, to prevent the white king from supporting his pawn. Now the white king changes his route and gets into the square of the black pawn. } (3... h3 4. Kd6 h2 5. c7 $10) 4. Kf4 { [%csl Gf4][%cal Bh4e4,Be4e1,Be1h1,Bh4h1] } *

{ [Vol I p.08 | [GEOMETRIC BOUNDARY EVALUATION]] BEACON: When an attacking side holds a Rook pawn plus a second pawn against a lone King, map whether the defender reaches the f-file/opposite-wing square in time. PITFALL: Judging rook-pawn-plus-wing endings by intuition instead of tracing the exact f-file / 8th-rank intersection. (Source: Walter Bähr (1936) • De la Villa Ending 12.16 • Dvoretsky DEM Ch. 1.) || BOOK NOTE: Blocked pawns not on the 5th rank yet We have already stated that the first thing to do is to push the rook's pawn as far as possible. If the stronger side pushes his pawn to the 5th rank, the ending is won. If the pawn is less advanced (4th, 3rd or 2nd rank) there is a sort of geometric rule to calculate quickly whether the ending is won or not. Actually, this rule can also be applied for pawns on the 5th or 6th ranks. The first theoretician to enunciate this rule was W. Bähr. Like any rule that requires remembering a geometrical figure on the board, it is very likely to be forgotten. Perhaps for this reason, different authors have tried to reformulate it to make it more general and simple. I have chosen that direction as well. Whatever rule you follow, you should understand why it works and pay attention to any feature that helps you remember it. Here the procedure to remember the rule comes from the observation of the king manoeuvres, which actually determine the rule itself. } { [%csl Bf5,Bf6,Bf7,Bf8][%cal Bc3f5,Rb5f8] } 1. Kd4! { After the capture of the white pawn, the black king must head for the drawing zone. The nearest squares are f7 and f8. Therefore, White must keep the passed pawn as far back as possible, so that it takes more time for the black king to capture the pawn and then come back to fight. } (1. b4? { would be a serious mistake, as then the black king's way back is easier and the ending would be drawn: } 1... Kb6 2. Kc4 Kc6 3. Kd4 Kb5 4. Ke5 Kxb4 5. Kf5 Kc5 { . The black king heads for f7 or f8, securing the draw; therefore, the f-file is the collision line for the kings and the clue to define the drawing line we will see later: } 6. Kg5 Kd6 7. Kxh5 Ke7 8. Kg6 Kf8 { and the black king reaches the saving file. }) 1... Kb4 2. Ke5 Kxb3 3. Kf5 Kc4 4. Kg5 Kd5 5. Kxh5 Ke6 6. Kg6! { in contrast with the 1. b4 line, the white king arrives in time to shoulder the enemy king away from the f-file. This position deserves another diagram: } { [%csl Rf5,Rf6,Rf7] } 6... Ke7 7. Kg7 $18 { The kings oppose one another and the black king cannot reach the f-file, which we will call the collision line. We can draw another idea from this example, though we will leave definitive conclusions for the next: *The passed pawn is best placed as far from promotion as possible.* } { [%csl Gg7,Re7][%cal Bh4h8] } *

{ [Vol I p.12 | [GEOMETRIC CIRCUIT TO STOP FLANK PAWNS]] BEACON: A Knight stops central pawns cleanly, yet struggles against 7th-rank Rook pawns (a/h). Blockade from IN FRONT—use check-circuits rather than sitting behind the pawn. PITFALL: Retreating a Knight onto the back rank behind an a/h pawn allows the enemy King to dominate its 2 corner squares. (Source: De la Villa Endings 11 & 12; Dvoretsky DEM Ch. 2.) || BOOK NOTE: As usual, the theoretical approach is different when dealing with a rook's pawn. The rook's pawn is the most dangerous scenario for a knight. This is because the edge of the board is closer, and so the mobility problems for the knight increase. Let us start with the 6th-rank rook's pawn. Here the drawing chances are similar to those seen against a 7th-rank central pawn. There are no problems for the knight if it can stand in front of the pawn; however, if the knight fails and just controls the square in the pawn's path, it must find the right circuit in order to save the game. Here the circuit is g4-e3-f1-h2. } { [%csl Rh3,Yh2][%cal Be5g4,Bg4e3,Ye3f1,Gf1h2] } 1. Ng4+! { The knight enters the right circuit. } { [%cal Bg4e3,Ge3f1,Gg4h2,Gf1h2] } (1. Nf3+? { fails. Here the knight enters a bad circuit and eventually is expelled. } 1... Kg2 2. Nh4+ (2. Ne1+ Kg3 $19) 2... Kf2 $19 { and the pawn promotes. }) (1. Nc4 { Draws as well, thanks to a small tactical device. It is worth noting it due to its paradoxical nature: in the starting position, White draws with the knight on e5, far from the pawn, but not with the knight on h4, close to the pawn. A series of checks helps the knight cross the board at great speed, but to do so the knight needs to find the right circuit: that is impossible starting from h4. } 1... Kg2 (1... Kg1 2. Ne5! { The point! Now the pawn cannot advance and the knight reaches g4 } 2... Kf1 3. Ng4! $10) (1... Kg3 2. Ne3) 2. Ne3+ $10) 1... Kg3 2. Ne3 { [%cal Be3f1,Gf1g3,Gf1h2] } 2... Kf3 3. Nf1 { [%cal Gf1h2] } 3... Kf2 4. Nh2 { The knight remains inside the right circuit, that is, h2-f1-e3-g4 and the black king cannot drive it away. Draw. “Conclusion: The knight draws against a 6th-rank rook's pawn if it can stand in front of it. If the knight just controls the pawn's path, it needs to enter the right circuit to draw, that is, for the h1-corner, g4-e3-f1. From the f3-square, the knight fails.” } { [%cal Bh2g4,Bh2f1,Gf1e3,Ge3g4] } *

{ [Vol I p.19 | [DIAGONAL INTERFERENCE vs. DRIVING DEFENDER ONTO <4-SQUARE SHORT SECTOR] | Centurini (1847): 1.Bf3! Ba4 2.Bc6!! +- | Intercepts the b5–e8 control diagonal cleanly so Pd6 promotes.] BEACON: Diagonal Interference (Centurini 1847: 1.Bf3! 2.Bc6!!) breaks long diagonals. When defending Bishop controls promotion ONLY along a short diagonal of <4 SQUARES (DLV 35: c8–b7–a6 = 3 squares!), drive it off the long cross-diagonal onto that cramped sector to win! PITFALL: Forgetting the exact '<4 squares' Short Diagonal threshold when evaluating whether Frontal Defense holds! (Source: Luigi Centurini 1847 (DEM 6-1) • De la Villa Ending 35 (JB #131).) || BOOK NOTE: Again a simple but somehow important chapter. Endings with same-coloured bishops arise with reasonably frequency. When there are many pawns on the board, the playing technique is easy and well known, especially the concept of the 'bad bishop'. However, with just one pawn, many players ignore an essential defensive method: rear opposition, which we will see in *Endings 34* and *35*. Since this is not an intuitive idea, few players find it if they do not know it. Even distinguished players have resigned in drawn positions. Here we must acknowledge the labour of Averbakh and Centurini, who studied almost all possible positions in great detail before the advent of computers and Nalimov endgame tablebases. Thanks to the labour of these great analysts, we can state that there is a series of very clear positions which help us find our way with ease. We could talk about four basic cases; actually, I will list them that way in the annotations but, since I have more confidence in descriptive headings, I will not label these endings as First Case, Second Case and so on, though some readers may prefer that system. It is easy to see that, if the defending king stands on a square in front of the pawn opposite to the bishops' colour, it is an ironclad draw. There is no need for analysis here; we can call this scenario the Zero Case. The ending becomes interesting when the defending king cannot secure a position in front of the pawn. Driving off the Defending Bishop Here we have what we could classify as the *First Case*: the stronger side's king near his pawn and ready to offer a bishop trade, and the defending king far away. Then the stronger side usually wins with a standard manoeuvre: driving off the enemy bishop from the diagonals which cross the pawn's path. } { [%csl Rc6,Rd7][%cal Bh5f3,Yf3c6] } 1. Bf3 { White is ready to move the bishop to c6, the ideal square. Trying to trade bishops on d7 also wins, but then the black bishop could relocate and offer resistance from the other diagonal, and the driving-off process would be longer. It is easy to see that, in order to drive off the defending bishop, the bishop swap has to be arranged where it does not interfere with the advance of the pawn. While this is obvious, the consequences are important for the theory of this ending. } { [%cal Bf3c6] } 1... Ba4 2. Bc6 { The black bishop has to leave or allow the exchange. } 2... Bxc6 3. Kxc6 Ke8 4. Kc7 { And the pawn promotes. It has been easy. “Conclusion: Without the support of the defending king, the bishop can always be ousted from the diagonals which control the advances of the pawn. Of course, then it is clear that the game is won if the pawn crosses the last blockade square.” So, are there hopes for the weaker side? The bishop needs king support, but how exactly can the king give support? } { [%cal Bd6d8] } *

{ [Vol I p.19 | [DIAGONAL INTERFERENCE vs. DRIVING DEFENDER ONTO <4-SQUARE SHORT SECTOR] | DLV Ending 35 (JB #131): <4-Square Short Diagonal | 1.Bc8! Be4 2.Bb7! Bd3 3.Bf3 Ba6! 4.Bg4! +- (c8–b7–a6 = only 3 squares — too short!)] BEACON: Diagonal Interference (Centurini 1847: 1.Bf3! 2.Bc6!!) breaks long diagonals. When defending Bishop controls promotion ONLY along a short diagonal of <4 SQUARES (DLV 35: c8–b7–a6 = 3 squares!), drive it off the long cross-diagonal onto that cramped sector to win! PITFALL: Forgetting the exact '<4 squares' Short Diagonal threshold when evaluating whether Frontal Defense holds! (Source: Luigi Centurini 1847 (DEM 6-1) • De la Villa Ending 35 (JB #131).) || BOOK NOTE: This position belongs to the *Third Case*. The defending king is behind the pawn, similar to the second case; however, a special feature will help us distinguish between the second and third cases. *One of the diagonals is very short*. How short? Less than 4 squares long. That is the point. Let us see why, so that we can learn the rule and thus guess the exceptions. } { [%csl Bc8,Gb7,Yg4,Ra8][%cal Gf5c8,Gc8b7,Bf3e4,Yb7f3] } 1. Bc8 { The first stage of the winning plan is driving off the black bishop from the long diagonal. } { [%cal Bc8b7,Gb7f3] } 1... Be4 2. Bb7 Bd3 (2... Bf5 3. Bf3 { [%cal Bb6b7] } 3... Bc8 4. Be2 { zugzwang. }) 3. Bf3 { [%cal Bb6b7] } 3... Ba6 { [%cal Ga6b7] } 4. Bg4! { Zugzwang. There is no good move for the king, and the short diagonal is controlled by White: two squares by the king and one by the bishop. Let us pay attention to this situation once again. The bishop can just take one square away from its counterpart; therefore, the king must take care of two. Now we can draw some important conclusions. “Conclusion: When the defending king has taken rear opposition, the ending is drawn if both control diagonals are 4 or more squares long. The stronger side wins if one diagonal is less than 4 squares long and he can control them all with the king and the bishop.” Of course, this rule only applies when the pawn has to cross the last blockade square. If the pawn is less advanced and there is yet another blockade square, the stronger side succeeds only in crossing the first obstacle. Victory will depend on the success or failure of the new defensive set-up on the next blockade square. Following this rule about the length of the diagonals, some theoretical studies present a borderline between drawn and winning positions depending on how advanced the pawn is. These borderlines are not my cup of tea, though I cannot deny they have certain theoretical interest. It think it is better to remember why things happen. } { [%csl Ra6,Ra5][%cal Gg4c8,Ga7b7,Gg4e2] } *

/* ── Parse PGN into GAMES array ── */
function parsePGNText(text) {
  const games = [];
  // Split into individual games by detecting header blocks
  const lines = text.split('\n');
  let currentHeaders = {};
  let currentMoves = '';
  let inHeaders = false;
  let hasGame = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    const headerMatch = line.match(/^\[(\w+)\s+"(.*)"\]$/);

    if (headerMatch) {
      if (hasGame && currentMoves.trim()) {
        games.push({ headers: currentHeaders, movetext: currentMoves.trim() });
        currentHeaders = {};
        currentMoves = '';
      }
      currentHeaders[headerMatch[1]] = headerMatch[2];
      inHeaders = true;
      hasGame = true;
    } else if (line === '') {
      if (inHeaders) inHeaders = false;
    } else {
      currentMoves += line + ' ';
    }
  }
  if (hasGame && currentMoves.trim()) {
    games.push({ headers: currentHeaders, movetext: currentMoves.trim() });
  }
  return games;
}

/* ── Extract annotations from comment text ── */
function extractAnnotations(comment) {
  const circles = [];
  const arrows = [];
  let textComment = comment;

  // Extract [%csl ...] circles
  textComment = textComment.replace(/\[%csl\s+([^\]]+)\]/g, function(match, data) {
    data.split(',').forEach(function(item) {
      item = item.trim();
      if (item.length >= 3) {
        circles.push({ color: item[0], square: item.substring(1) });
      }
    });
    return '';
  });

  // Extract [%cal ...] arrows
  textComment = textComment.replace(/\[%cal\s+([^\]]+)\]/g, function(match, data) {
    data.split(',').forEach(function(item) {
      item = item.trim();
      if (item.length >= 5) {
        arrows.push({ color: item[0], from: item.substring(1, 3), to: item.substring(3, 5) });
      }
    });
    return '';
  });

  return { text: textComment.trim(), circles: circles, arrows: arrows };
}

/* ── Format comment text for display ── */
// Label color map: add your own keywords here!

var LABEL_COLORS = {
  'BEACON': 'green', 'KEY': 'green', 'KEY IDEA': 'green', 'WINNING IDEA': 'green', 'GOAL': 'green',
  'PITFALL': 'red', 'WARNING': 'red', 'DANGER': 'red', 'MISTAKE': 'red', 'TRAP': 'red', 'BLUNDER': 'red',
  'BOOK NOTE': 'blue', 'NOTE': 'blue', 'RULE': 'blue', 'PRINCIPLE': 'blue', 'REMEMBER': 'blue',
  'KEY CONCEPT': 'purple', 'CONCEPT': 'purple', 'THEME': 'purple', 'PATTERN': 'purple', 'STRATEGY': 'purple',
  'TIP': 'orange', 'HINT': 'orange', 'PLAN': 'orange', 'TECHNIQUE': 'orange', 'METHOD': 'orange',
  'EXERCISE': 'teal', 'QUESTION': 'teal', 'TEST': 'teal', 'DRILL': 'teal'
};
function formatComment(text, isBlock) {
  if (!text) return '';
  var s = text.trim();
  if (!isBlock) return s;

  // Split on || separator into paragraphs
  var parts = s.split(/\|\|/).map(function(p) { return p.trim(); }).filter(Boolean);
  var out = '';
  for (var pi = 0; pi < parts.length; pi++) {
    var p = parts[pi];
    // Extract source references like (Source: ...)
    p = p.replace(/\(Source:\s*([^)]+)\)/g, '<span class="csrc">Source: $1</span>');
    // Auto-detect UPPERCASE LABEL: patterns (1-3 words, all caps, followed by colon)
    p = p.replace(/\b([A-Z][A-Z ]{0,20}[A-Z]):\s*/g, function(match, label) {
      var key = label.trim();
      var color = LABEL_COLORS[key] || 'default';
      var display = key.charAt(0) + key.slice(1).toLowerCase();
      return '<span class="clabel cl-' + color + '">' + display + '</span> ';
    });
    // Strip leading bracket references like [Vol I p.04 | [...]]
    p = p.replace(/^\[Vol\s+[^\]]*\]\s*/i, '');
    p = p.replace(/^\[\[?[A-Z ]+\/?[A-Z ]*\]?\]\s*/i, '');
    // Clean up double spaces
    p = p.replace(/\s{2,}/g, ' ').trim();
    if (p) out += '<p style="margin:.4em 0">' + p + '</p>';
  }
  return out;
}

/* ── Parse movetext with comments ── */
function parseMovetext(movetext) {
  // Tokenize: moves, comments in {}, move numbers, result
  const tokens = [];
  let i = 0;
  while (i < movetext.length) {
    if (movetext[i] === '{') {
      let j = movetext.indexOf('}', i);
      if (j === -1) j = movetext.length;
      tokens.push({ type: 'comment', text: movetext.substring(i + 1, j) });
      i = j + 1;
    } else if (movetext[i] === '(') {
      // Capture variation content
      let depth = 1;
      let j = i + 1;
      while (j < movetext.length && depth > 0) {
        if (movetext[j] === '(') depth++;
        else if (movetext[j] === ')') depth--;
        j++;
      }
      const varText = movetext.substring(i + 1, j - 1).trim();
      tokens.push({ type: 'variation', text: varText });
      i = j;
    } else if (movetext[i] === ')') {
      i++;
    } else if (/\s/.test(movetext[i])) {
      i++;
    } else {
      let j = i;
      while (j < movetext.length && !/[\s{}()]/.test(movetext[j])) j++;
      const word = movetext.substring(i, j);
      // Skip move numbers and results
      if (/^\d+\.+$/.test(word) || /^(1-0|0-1|1\/2-1\/2|\*)$/.test(word)) {
        if (/^(1-0|0-1|1\/2-1\/2|\*)$/.test(word)) {
          tokens.push({ type: 'result', text: word });
        }
        // else skip move numbers
      } else {
        tokens.push({ type: 'move', text: word });
      }
      i = j;
    }
  }
  return tokens;
}

/* ── Build game data from parsed PGN ── */
function buildGameData(pgn) {
  const startFen = pgn.headers.FEN || pgn.headers.Fen || null;
  const chess = startFen ? new Chess(startFen) : new Chess();
  const positions = [{ fen: chess.fen(), san: null, from: null, to: null, ply: 0, comment: null, circles: [], arrows: [], variation: null }];
  const tokens = parseMovetext(pgn.movetext);

  let plyCount = 0;

  for (let i = 0; i < tokens.length; i++) {
    const tok = tokens[i];

    if (tok.type === 'comment') {
      const ann = extractAnnotations(tok.text);
      const lastPos = positions[positions.length - 1];
      if (lastPos.comment) {
        lastPos.comment += ' ' + ann.text;
      } else {
        lastPos.comment = ann.text || null;
      }
      lastPos.circles = lastPos.circles.concat(ann.circles);
      lastPos.arrows = lastPos.arrows.concat(ann.arrows);
    } else if (tok.type === 'variation') {
      // Re-tokenize variation but keep move numbers for display
      let varDisplay = '';
      let vi = 0;
      const vt = tok.text;
      while (vi < vt.length) {
        if (vt[vi] === '{') {
          let vj = vt.indexOf('}', vi);
          if (vj === -1) vj = vt.length;
          const vAnn = extractAnnotations(vt.substring(vi + 1, vj));
          if (vAnn.text) varDisplay += vAnn.text + ' ';
          vi = vj + 1;
        } else if (/\s/.test(vt[vi])) {
          vi++;
        } else {
          let vj = vi;
          while (vj < vt.length && !/[\s{}]/.test(vt[vj])) vj++;
          varDisplay += vt.substring(vi, vj) + ' ';
          vi = vj;
        }
      }
      // Attach variation to the last position
      const lastPos = positions[positions.length - 1];
      if (!lastPos.variation) lastPos.variation = '';
      if (lastPos.variation) lastPos.variation += ' ';
      lastPos.variation += varDisplay.trim();
    } else if (tok.type === 'move') {
      const m = chess.move(tok.text, { sloppy: true });
      if (m) {
        plyCount++;
        positions.push({
          fen: chess.fen(),
          san: m.san,
          from: m.from,
          to: m.to,
          ply: plyCount,
          comment: null,
          circles: [],
          arrows: [],
          variation: null
        });
      }
    }
  }

  return {
    white: pgn.headers.White || pgn.headers.Event || 'White',
    black: pgn.headers.Black || '',
    event: pgn.headers.Event || '',
    site: pgn.headers.Site || '',
    date: pgn.headers.Date || '',
    eco: pgn.headers.ECO || '',
    opening: pgn.headers.Opening || '',
    result: pgn.headers.Result || '*',
    annotator: pgn.headers.Annotator || '',
    orientation: (pgn.headers.Orientation || 'white').toLowerCase(),
    studyName: pgn.headers.StudyName || '',
    chapterName: pgn.headers.ChapterName || '',
    positions: positions
  };
}

/* ── Color map for annotations ── */
function annColor(c) {
  switch (c) {
    case 'R': return 'rgba(235, 97, 80, 0.8)';
    case 'G': return 'rgba(20, 130, 50, 0.8)';
    case 'B': return 'rgba(0, 100, 220, 0.8)';

    default:  return 'rgba(20, 130, 50, 0.8)';

/* ── Square to SVG coordinates ── */
function sqToXY(sq) {
  const f = 'abcdefgh'.indexOf(sq[0]);
  const r = 8 - parseInt(sq[1]);
  const x = flipped ? (7 - f) * 100 + 50 : f * 100 + 50;
  const y = flipped ? (7 - r) * 100 + 50 : r * 100 + 50;
  return { x, y };
}

/* ── Render SVG overlay (arrows + circles) ── */
function renderOverlay(circles, arrows) {
  const svg = document.getElementById('svg-overlay');
  let html = '<defs>';
  // Arrowhead markers for each color
  ['R','G','B','Y'].forEach(function(c) {
    html += '<marker id="ah-' + c + '" markerWidth="4" markerHeight="4" refX="2.5" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="' + annColor(c) + '"/></marker>';
  });
  html += '</defs>';

  // Draw circles
  circles.forEach(function(c) {
    const pos = sqToXY(c.square);
    html += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="42" fill="none" stroke="' + annColor(c.color) + '" stroke-width="6" opacity="0.85"/>';
  });

  // Draw arrows
  arrows.forEach(function(a) {
    const from = sqToXY(a.from);
    const to = sqToXY(a.to);
    // Shorten arrow so arrowhead doesn't overshoot
    const dx = to.x - from.x, dy = to.y - from.y;
    const len = Math.sqrt(dx * dx + dy * dy);
    const shorten = 18;
    const ex = to.x - (dx / len) * shorten;
    const ey = to.y - (dy / len) * shorten;
    html += '<line x1="' + from.x + '" y1="' + from.y + '" x2="' + ex + '" y2="' + ey + '" stroke="' + annColor(a.color) + '" stroke-width="12" stroke-linecap="round" opacity="0.75" marker-end="url(#ah-' + a.color + ')"/>';
  });

  svg.innerHTML = html;
}

function fenToBoard(fen) {
  const rows = fen.split(' ')[0].split('/');

    const r = [];

      else r.push(ch);
    }
    board.push(r);
  }
  return board;
}

      const isLight = (r + f) % 2 === 0;
      const sq = 'abcdefgh'[f] + (8 - r);
      let cls = 'sq ' + (isLight ? 'l' : 'd');
      let circHTML = '';
      if (lastFrom === sq) { cls += ' lm lm-from'; circHTML = '<div class="circ"></div>'; }
      else if (lastTo === sq) { cls += ' lm lm-to'; circHTML = '<div class="circ"></div>'; }
      const piece = board[r][f];
      const pcHTML = piece ? '<div class="pc ' + PIECE_MAP[piece] + '"></div>' : '';
      html += '<div class="' + cls + '">' + pcHTML + circHTML + '</div>';
    }
  }
  return html;
}

function updateCoords() {
  const rkEl = document.getElementById('rk');
  const flEl = document.getElementById('fl');
  const ranks = flipped ? ['1','2','3','4','5','6','7','8'] : ['8','7','6','5','4','3','2','1'];
  const files = flipped ? 'hgfedcba' : 'abcdefgh';
  rkEl.innerHTML = ranks.map(r => '<span>' + r + '</span>').join('');
  flEl.innerHTML = files.split('').map(f => '<span>' + f + '</span>').join('');
}

function moveLabel(ply, san) {
  const n = Math.ceil(ply / 2);
  return ply % 2 === 1 ? n + '.' + san : n + '...' + san;
}

/* ── Navigate ── */
function goTo(ply) {
  ply = Math.max(0, Math.min(totalPly, ply));
  curPly = ply;
  const pos = positions[ply];
  document.getElementById('bd').innerHTML = boardHTML(pos.fen, pos.from, pos.to);

  // Render arrows and circles
  renderOverlay(pos.circles || [], pos.arrows || []);

  const whoEl = document.getElementById('who');
  const g = GAMES[curGameIdx];
  if (ply === 0) whoEl.innerHTML = '<b>' + g.white + '</b>' + (g.black ? ' vs <b>' + g.black + '</b>' : '');
  else {
    const turn = ply % 2 === 1 ? g.white : (g.black || 'Black');
    whoEl.innerHTML = '<b>' + turn + '</b> played ' + moveLabel(ply, pos.san);
  }

  document.getElementById('status').textContent = ply === totalPly && g.result !== '*' ? 'Game over – ' + g.result : '';

  // Show comment below board
  const commentEl = document.getElementById('boardComment');
  commentEl.textContent = pos.comment || '';

  document.querySelectorAll('a.mv').forEach(a => {
    a.classList.toggle('cur', +a.dataset.ply === ply);
  });

  const curMv = document.querySelector('a.mv.cur');
  if (curMv) curMv.scrollIntoView({block: 'nearest', behavior: 'smooth'});
}

/* ── Render game into main content ── */
function renderGame(g) {
  positions = g.positions;
  totalPly = positions.length - 1;
  curPly = 0;

  const el = document.getElementById('content');
  let html = '';

  // header
  const ecoVal = (g.eco && g.eco !== '?') ? g.eco : '';
  const openVal = (g.opening && g.opening !== '?') ? g.opening : '';
  if (ecoVal || openVal) {
    html += '<div class="kicker">' + (ecoVal ? ecoVal + ' ' : '') + openVal + '</div>';
  }

  // Title: prefer study/chapter name, then player names, then event
  let title = '';
  if (g.chapterName || g.studyName) {
    title = g.chapterName || g.studyName;
  } else if (g.white && g.black) {
    title = g.white + ' vs ' + g.black;
  } else {
    title = g.white || g.event || 'Game';
  }
  html += '<h1>' + title + '</h1>';

  // Sub-header
  const parts = [];
  if (g.event) parts.push(g.event);
  if (g.site) parts.push(g.site);
  if (g.date) parts.push(g.date);
  if (g.result && g.result !== '*') parts.push('Result: <b>' + g.result + '</b>');
  if (parts.length) html += '<p class="gamehead">' + parts.join(' &middot; ') + '</p>';
  if (g.annotator) html += '<p class="gamehead" style="font-style:italic">Annotator: ' + g.annotator + '</p>';

  // Starting position comment (always block-style)
  if (positions[0].comment) {
    html += '<div class="comment-block">' + formatComment(positions[0].comment, true) + '</div>';
  }

  // Moves with inline comments
  html += '<div class="ml">';
  for (let i = 1; i <= totalPly; i++) {
    const pos = positions[i];
    if (i % 2 === 1) {
      html += '<b>' + Math.ceil(i/2) + '.</b>';
    }
    html += '<a class="mv" data-ply="' + i + '" onclick="goTo(' + i + ')">' + pos.san + '</a> ';

    // Comment after the move: block if long, inline if short
    if (pos.comment) {
      if (pos.comment.length > 120) {
        html += '<div class="comment-block">' + formatComment(pos.comment, true) + '</div>';
      } else {
        html += '<span class="comment">' + pos.comment + '</span> ';
      }
    }
    // Inline variation after the move/comment
    if (pos.variation) {
      html += '<span class="variation">(' + pos.variation + ')</span> ';
    }
  }
  if (g.result && g.result !== '*') {
    html += '<b>' + g.result + '</b>';
  }
  html += '</div>';

  el.innerHTML = html;
}

/* ── Controls ── */
document.getElementById('bStart').onclick = function() { goTo(0); };
document.getElementById('bPrev').onclick = function() { goTo(curPly - 1); };
document.getElementById('bNext').onclick = function() { goTo(curPly + 1); };
document.getElementById('bEnd').onclick = function() { goTo(totalPly); };
document.getElementById('bFlip').onclick = function() { flipped = !flipped; updateCoords(); goTo(curPly); };

/* keyboard */
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(curPly - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); goTo(curPly + 1); }
  else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
  else if (e.key === 'End') { e.preventDefault(); goTo(totalPly); }
  else if (e.key === 'f' || e.key === 'F') { flipped = !flipped; updateCoords(); goTo(curPly); }
});

/* dark mode */
document.getElementById('dark').onclick = function() {
  var root = document.documentElement;
  var isDark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', isDark ? '' : 'dark');
  this.textContent = isDark ? 'Dark' : 'Light';
};

/* text size */
var fs = 21;
document.getElementById('fplus').onclick = function() { fs = Math.min(32, fs + 2); document.documentElement.style.setProperty('--fs', fs + 'px'); };
document.getElementById('fminus').onclick = function() { fs = Math.max(14, fs - 2); document.documentElement.style.setProperty('--fs', fs + 'px'); };

/* board toggle (mobile) */
document.getElementById('bTog').onclick = function() {
  document.body.classList.toggle('hideb');
  this.textContent = document.body.classList.contains('hideb') ? 'Show board' : 'Hide board';
};

/* ── Load a game by index ── */
function loadGame(idx) {
  curGameIdx = idx;
  const g = GAMES[idx];
  flipped = g.orientation === 'black';
  updateCoords();
  renderGame(g);
  goTo(0);
  // update sidebar highlight
  document.querySelectorAll('nav.toc a').forEach(a => {
    a.classList.toggle('on', +a.dataset.g === idx);
  });
}

/* ── Download HTML ── */
document.getElementById('dlHtml').onclick = function() {
  var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  var blob = new Blob([html], {type: 'text/html'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  var g = GAMES[curGameIdx];
  var title = (g.white && g.black) ? g.white + ' vs ' + g.black : g.chapterName || g.event || 'game';
  a.download = title.replace(/[^a-zA-Z0-9 ]/g,'').replace(/ +/g,'_') + '.html';
  a.click();
  URL.revokeObjectURL(a.href);
};

/* ── Print / PDF ── */
/* download PGN for current game */
document.getElementById('dlPgn').onclick = function() {
  var raw = PARSED_RAW[curGameIdx];
  if (!raw) return;
  var pgn = '';
  // Rebuild headers
  var headerOrder = ['Event','Site','Date','Round','White','Black','Result','Annotator','Variant','ECO','Opening','StudyName','ChapterName','ChapterURL','FEN','SetUp','Orientation'];
  headerOrder.forEach(function(key) {
    if (raw.headers[key]) pgn += '[' + key + ' "' + raw.headers[key] + '"]\n';
  });
  // Any remaining headers not in the standard order
  Object.keys(raw.headers).forEach(function(key) {
    if (headerOrder.indexOf(key) === -1) pgn += '[' + key + ' "' + raw.headers[key] + '"]\n';
  });
  pgn += '\n' + raw.movetext + '\n';
  // Download
  var blob = new Blob([pgn], { type: 'application/x-chess-pgn' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var name = (GAMES[curGameIdx].chapterName || GAMES[curGameIdx].white || 'game').replace(/[^a-zA-Z0-9_ -]/g, '').substring(0, 60).trim();
  a.href = url;
  a.download = name + '.pgn';
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('dlPrint').onclick = function() {
  window.print();
};

/* ── Init ── */
(function() {
  const parsed = parsePGNText(PGN_TEXT);
  PARSED_RAW = parsed;
  GAMES = parsed.map(buildGameData);

  // Build sidebar
  const toc = document.getElementById('toc');
  GAMES.forEach(function(g, idx) {
    const a = document.createElement('a');
    a.dataset.g = idx;
    a.onclick = function() { loadGame(idx); };
    if (g.chapterName || g.studyName) {
      a.textContent = g.chapterName || g.studyName;
    } else if (g.white && g.black) {
      a.textContent = g.white + ' – ' + g.black;
    } else {
      a.textContent = g.event || 'Game ' + (idx + 1);
    }
    if (idx === 0) a.className = 'on';
    toc.appendChild(a);
  });

  if (GAMES.length > 0) loadGame(0);
})();
</script>
